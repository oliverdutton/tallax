
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tallax"
version = "0.0.1"
description = "High-performance sorting and top-k operations for JAX on TPUs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jax",
    "pandas",
    "numpy",
    "scipy"
]

[project.urls]
"Homepage" = "https://github.com/google/maxtext"

[project.optional-dependencies]
tpu = ["jax[tpu]==0.8.0"]
dev = ["pytest>=7.0.0"]

[tool.ruff]
preview = true
exclude = [
    ".git",
    "build",
    "__pycache__",
]
line-length = 80
indent-width = 2
target-version = "py39"

[tool.ruff.lint]
select = [
    "B9",
    "C",
    "F",
    "W",
    "YTT",
    "ASYNC",
    "E101",
    "E112",
    "E113",
    "E115",
    "E117",
    "E225",
    "E227",
    "E228",
]

[tool.ruff.lint.mccabe]
max-complexity = 18
